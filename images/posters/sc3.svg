<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">SC³ — The Multi-Solvent Solubility Challenge and Benchmark</title>
  <desc id="desc">One shared molecular specimen fans into a six-column qualitative solvent benchmark matrix. Each column shows a different solvent molecule. The matrix illustrates distinct test conditions and contains no measured scores.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fffaf9"/><stop offset="1" stop-color="#f1eaf3"/></linearGradient>
    <linearGradient id="solute" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b84694"/><stop offset="1" stop-color="#7e3b8d"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#18284e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="sharedMolecule" fill="none" stroke="#18284e" stroke-width="3.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-74 8 -48-42 7-51 46-14 39 43 -16 57 -64 42Z"/>
      <path d="M-48-42 -59-74M7-51 20-82M46-14 78-25M39 43 67 62M-16 57-21 86M-64 42-91 60M-74 8-103-7"/>
      <path d="M-55 5 -37-31M-5-36 28-16M28 15 4 46" stroke="#526fc7" stroke-width="2.2"/>
      <g fill="#b84694" stroke="#fff9fe" stroke-width="2"><circle cx="-74" cy="8" r="5.5"/><circle cx="7" cy="-51" r="5.5"/><circle cx="39" cy="43" r="5.5"/><circle cx="-64" cy="42" r="5.5"/></g>
      <g fill="#536dc4" stroke="#fff9fe" stroke-width="2"><circle cx="-48" cy="-42" r="5.5"/><circle cx="46" cy="-14" r="5.5"/><circle cx="-16" cy="57" r="5.5"/></g>
    </g>
  </defs>
  <rect width="1200" height="800" fill="url(#paper)"/>
  <path d="M0 0H1200V13H0Z" fill="#a84391"/>
  <text x="56" y="49" fill="#625a75" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="2.6">NEURIPS 2026</text>
  <text x="48" y="169" fill="#18284e" font-family="Arial,Helvetica,sans-serif" font-size="134" font-weight="900" letter-spacing="-10">SC<tspan fill="#a84391">³</tspan></text>
  <path d="M367 74V181" stroke="#c7b7ca" stroke-width="1.6"/>
  <text x="404" y="97" fill="#18284e" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" letter-spacing=".4">THE MULTI-SOLVENT</text>
  <text x="404" y="132" fill="#18284e" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" letter-spacing=".4">SOLUBILITY CHALLENGE</text>
  <text x="404" y="167" fill="#a84391" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" letter-spacing=".4">AND BENCHMARK</text>
  <text x="1144" y="178" text-anchor="end" fill="#686178" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">ONE SHARED SPECIMEN / DISTINCT TEST CONDITIONS</text>
  <path d="M55 203H1145" stroke="#c7b8cb" stroke-width="1.3"/>
  <circle cx="55" cy="203" r="4" fill="#a84391"/>

  <text x="62" y="246" fill="#645b75" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="2.1">SAME SOLUTE</text>
  <text x="322" y="246" fill="#645b75" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" letter-spacing="2.1">SOLVENT MATRIX</text>
  <text x="1138" y="246" text-anchor="end" fill="#a84391" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">SIX SOLVENT CONDITIONS</text>

  <!-- Shared solute specimen -->
  <path d="M55 270Q55 256 69 256H295Q309 256 309 270V704H55Z" fill="#faeef4" stroke="#ddc7d8" stroke-width="1.4"/>
  <path d="M55 271H309" stroke="#ad438f" stroke-width="5"/>
  <text x="182" y="310" text-anchor="middle" fill="#726579" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.8">ONE MOLECULAR INPUT</text>
  <g transform="translate(180 467) scale(1.08)"><use href="#sharedMolecule"/></g>
  <text x="182" y="623" text-anchor="middle" fill="#18284e" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" letter-spacing="1.2">SAME SOLUTE</text>
  <text x="182" y="650" text-anchor="middle" fill="#786c80" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="500">held constant across the panel</text>
  <path d="M278 467H321" fill="none" stroke="#18284e" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Six-column comparison matrix: qualitative conditions, no values or ranking. -->
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="323" y="270" width="815" height="434" fill="#fffdfd" stroke="#d6c8d8" stroke-width="1.4"/>
    <path d="M323 324H1138" stroke="#bcb0c4" stroke-width="1.2"/>
    <path d="M323 628H1138" stroke="#bcb0c4" stroke-width="1.2"/>
    <rect x="324" y="271" width="135" height="432" fill="#f9eaf1" opacity=".74"/>
    <rect x="460" y="271" width="135" height="432" fill="#f7f2f7" opacity=".7"/>
    <rect x="596" y="271" width="135" height="432" fill="#f8eaf1" opacity=".72"/>
    <rect x="732" y="271" width="135" height="432" fill="#f3eff8" opacity=".76"/>
    <rect x="868" y="271" width="135" height="432" fill="#f8eaf1" opacity=".72"/>
    <rect x="1004" y="271" width="133" height="432" fill="#f2eff8" opacity=".78"/>
    <path d="M459 270V704M595 270V704M731 270V704M867 270V704M1003 270V704" stroke="#d8cbd9" stroke-width="1.1"/>
    <g fill="#302c55" font-size="13" font-weight="800" letter-spacing="1.2" text-anchor="middle">
      <text x="391" y="303">WATER</text><text x="527" y="303">ETHANOL</text><text x="663" y="303">ACETONE</text>
      <text x="799" y="303">BENZENE</text><text x="935" y="303" font-size="11.5" letter-spacing=".35">ACETONITRILE</text><text x="1070" y="303">DMSO</text>
    </g>
    <!-- The exact same solute glyph is repeated above every solvent condition. -->
    <text x="730" y="350" text-anchor="middle" fill="#756a7d" font-size="11" font-weight="700" letter-spacing="1.4">IDENTICAL SOLUTE IN EACH COLUMN</text>
    <g transform="translate(391 383) scale(.24)"><use href="#sharedMolecule"/></g>
    <g transform="translate(527 383) scale(.24)"><use href="#sharedMolecule"/></g>
    <g transform="translate(663 383) scale(.24)"><use href="#sharedMolecule"/></g>
    <g transform="translate(799 383) scale(.24)"><use href="#sharedMolecule"/></g>
    <g transform="translate(935 383) scale(.24)"><use href="#sharedMolecule"/></g>
    <g transform="translate(1070 383) scale(.24)"><use href="#sharedMolecule"/></g>
    <g fill="none" stroke="#18284e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <!-- Water H–O–H -->
      <g transform="translate(391 508)"><path d="M-30 13 0-8 30 13"/></g>
      <!-- Ethanol CH3–CH2–OH -->
      <g transform="translate(527 508)"><path d="M-34 12 0-7 24-4"/></g>
      <!-- Acetone CH3–C(=O)–CH3 -->
      <g transform="translate(663 508)"><path d="M-43 10H0L43 10M0 7V-29M6 7V-29"/></g>
      <!-- Benzene: aromatic ring -->
      <g transform="translate(799 508)"><path d="M0-37 32-19 32 18 0 37-32 18-32-19Z"/><path d="M-22-16 0-28M23-12V12M-22 14 0 27" stroke="#536fc6" stroke-width="2.1"/></g>
      <!-- Acetonitrile CH3–C≡N -->
      <g transform="translate(935 508)"><path d="M-46 10H-17M-17 10H20M-17 5H20M-17 15H20" stroke-width="2.1"/></g>
      <!-- DMSO (CH3)2S=O -->
      <g transform="translate(1070 508)"><path d="M-39 23 0 0 39 23M0-2V-34M6-2V-34"/></g>
    </g>
    <g font-size="18" font-weight="700" text-anchor="middle">
      <text x="391" y="505" fill="#a84391">O</text>
      <text x="561" y="507" fill="#a84391" font-size="16">OH</text>
      <text x="663" y="480" fill="#a84391">O</text>
      <text x="967" y="525" fill="#536fc6">N</text>
      <text x="1070" y="514" fill="#7753a7">S</text><text x="1070" y="478" fill="#a84391">O</text>
      <text x="361" y="533" fill="#302c55" font-size="15">H</text>
      <text x="421" y="533" fill="#302c55" font-size="15">H</text>
    </g>
    <text x="730" y="650" text-anchor="middle" fill="#655c70" font-size="11.5" font-weight="700" letter-spacing="1.4">SOLVENT CONTEXT</text>
  </g>
  <path d="M58 738H1142" stroke="#cabdcf" stroke-width="1.2"/>
  <text x="1140" y="770" text-anchor="end" fill="#776d81" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2">CONCEPT DIAGRAM</text>
</svg>
