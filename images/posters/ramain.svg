<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">ramAIn — Computer-use agents</title>
  <desc id="poster-desc">A technical illustration of an AI agent moving through web portals and legacy software in a connected Observe, Reason, Act, Verify loop. Layered application windows form the center of the workflow, with a verified result returning the agent to observation.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f3f3ff"/>
      <stop offset=".54" stop-color="#e8f4ff"/>
      <stop offset="1" stop-color="#dff6fa"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2=".9">
      <stop stop-color="#101943"/>
      <stop offset=".52" stop-color="#172866"/>
      <stop offset="1" stop-color="#101a43"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#f9fbff"/>
      <stop offset="1" stop-color="#e4edff"/>
    </linearGradient>
    <linearGradient id="windowBlue" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f2faff"/>
      <stop offset="1" stop-color="#dcefff"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#84ddff" stop-opacity=".06"/>
      <stop offset=".5" stop-color="#81caff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#aaa1ff" stop-opacity=".07"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#7fbcff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#7fbcff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#a9c4ff" stroke-opacity=".09" stroke-width="1"/>
      <circle r="1.4" fill="#c4d7ff" fill-opacity=".2"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="13"/>
      <feOffset dy="13"/>
      <feComponentTransfer><feFuncA type="linear" slope=".28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#9ae7ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <clipPath id="fieldClip"><rect x="42" y="220" width="1116" height="530" rx="30"/></clipPath>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <path d="M48 202H1152" stroke="#b9c9eb" stroke-width="1.5"/>
  <text x="58" y="61" fill="#445580" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3.1">COMPUTER-USE AGENTS  /  RAMAIN</text>
  <text x="48" y="180" fill="#111a48" font-family="Arial, Helvetica, sans-serif" font-size="132" font-weight="800" letter-spacing="-7">ramAIn</text>
  <text x="1143" y="151" fill="#263d78" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="end" letter-spacing="1.3">WEB PORTALS</text>
  <text x="1143" y="181" fill="#526795" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="600" text-anchor="end" letter-spacing="1.5">LEGACY SYSTEMS</text>
  <circle cx="1117" cy="91" r="10" fill="#3975f5"/>
  <circle cx="1117" cy="91" r="19" fill="none" stroke="#3975f5" stroke-opacity=".24" stroke-width="2"/>

  <rect x="42" y="220" width="1116" height="530" rx="30" fill="url(#field)"/>
  <g clip-path="url(#fieldClip)">
    <rect x="42" y="220" width="1116" height="530" fill="url(#grid)"/>
    <ellipse cx="599" cy="477" rx="460" ry="310" fill="url(#glow)" opacity=".8"/>
    <path d="M83 495C141 377 207 333 308 333H884C1014 333 1092 388 1116 495C1091 606 1011 656 884 656H310C205 656 136 609 83 495Z" fill="none" stroke="#87a8ff" stroke-opacity=".19" stroke-width="1.5" stroke-dasharray="3 10"/>

    <!-- A connected cycle runs around the application surface. -->
    <g fill="none" stroke="#9ae7ff" stroke-width="2.4" stroke-opacity=".8" marker-end="url(#arrow)">
      <path d="M273 378C342 332 412 317 481 328"/>
      <path d="M725 329C813 317 888 337 943 382"/>
      <path d="M955 599C887 647 811 664 724 653"/>
      <path d="M477 653C389 665 315 643 258 601"/>
    </g>

    <!-- Layered, diagrammatic software surfaces: portal, records, and a legacy form. -->
    <g filter="url(#shadow)">
      <g transform="rotate(-5 606 490)">
        <rect x="375" y="355" width="454" height="275" rx="17" fill="#8ca9ef" fill-opacity=".46"/>
        <rect x="365" y="345" width="454" height="275" rx="17" fill="url(#windowBlue)"/>
        <path d="M365 362Q365 345 382 345H802Q819 345 819 362V389H365Z" fill="#d7e6ff"/>
        <circle cx="387" cy="367" r="4.5" fill="#8ea8df"/><circle cx="403" cy="367" r="4.5" fill="#8ea8df"/><circle cx="419" cy="367" r="4.5" fill="#8ea8df"/>
        <rect x="485" y="357" width="222" height="19" rx="9.5" fill="#f4f7ff"/>
        <text x="387" y="421" fill="#667ba9" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">LEGACY DESK</text>
        <rect x="387" y="437" width="410" height="1" fill="#bdcce8"/>
        <rect x="387" y="457" width="112" height="13" rx="6.5" fill="#aebddc"/>
        <rect x="387" y="483" width="410" height="34" rx="6" fill="#fff" stroke="#c9d7ee"/>
        <rect x="401" y="495" width="145" height="9" rx="4.5" fill="#94a8d0"/>
        <rect x="387" y="532" width="188" height="42" rx="7" fill="#4468df"/>
        <text x="481" y="558" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing=".7">SAVE RECORD</text>
        <rect x="588" y="539" width="205" height="27" rx="13.5" fill="#e5ecfa"/>
      </g>
      <g transform="rotate(4 596 484)">
        <rect x="421" y="381" width="441" height="263" rx="17" fill="#8ca9ef" fill-opacity=".46"/>
        <rect x="411" y="371" width="441" height="263" rx="17" fill="url(#window)"/>
        <path d="M411 388Q411 371 428 371H835Q852 371 852 388V414H411Z" fill="#e0eaff"/>
        <circle cx="433" cy="393" r="4.5" fill="#8ea8df"/><circle cx="449" cy="393" r="4.5" fill="#8ea8df"/><circle cx="465" cy="393" r="4.5" fill="#8ea8df"/>
        <rect x="531" y="383" width="210" height="19" rx="9.5" fill="#f9fbff"/>
        <rect x="432" y="434" width="96" height="171" rx="8" fill="#edf2ff"/>
        <rect x="445" y="450" width="67" height="8" rx="4" fill="#abbbe0"/>
        <rect x="445" y="470" width="54" height="7" rx="3.5" fill="#c0cce5"/>
        <rect x="445" y="491" width="59" height="7" rx="3.5" fill="#c0cce5"/>
        <rect x="445" y="512" width="47" height="7" rx="3.5" fill="#c0cce5"/>
        <rect x="547" y="434" width="286" height="171" rx="8" fill="#fff" stroke="#d7e1f1"/>
        <text x="568" y="462" fill="#586b99" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">CASE RECORD</text>
        <rect x="568" y="476" width="235" height="1" fill="#e0e6f2"/>
        <rect x="568" y="492" width="85" height="8" rx="4" fill="#aebddc"/>
        <rect x="568" y="509" width="232" height="31" rx="5" fill="#f8fbff" stroke="#c8d7f1"/>
        <rect x="579" y="520" width="136" height="8" rx="4" fill="#7893c8"/>
        <rect x="568" y="551" width="85" height="8" rx="4" fill="#aebddc"/>
        <rect x="568" y="568" width="232" height="24" rx="5" fill="#ebf8fc" stroke="#93d8eb" stroke-width="1.6"/>
        <path d="M785 576l5 5 9-10" fill="none" stroke="#2688a9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Cursor and focus ring show the agent acting on a real interface. -->
    <circle cx="804" cy="552" r="31" fill="#66d6ff" fill-opacity=".12" stroke="#8ee8ff" stroke-opacity=".78" stroke-width="1.6"/>
    <path d="M793 534L795 565L803 557L811 570L817 567L809 553L821 552Z" fill="#f4fcff" stroke="#18336b" stroke-width="2" stroke-linejoin="round"/>

    <!-- Four readable phases sit around the windows, each with a distinct signal. -->
    <g font-family="Arial, Helvetica, sans-serif">
      <g>
        <circle cx="186" cy="386" r="32" fill="#233d82" stroke="#83dfff" stroke-width="1.5"/>
        <path d="M172 386c7-10 21-10 28 0-7 10-21 10-28 0Z" fill="none" stroke="#b3f0ff" stroke-width="2"/>
        <circle cx="186" cy="386" r="4.5" fill="#b3f0ff"/>
        <text x="186" y="439" fill="#f5f7ff" text-anchor="middle" font-size="20" font-weight="700">Observe</text>
        <text x="186" y="463" fill="#afc2f0" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="1">SCREEN STATE</text>
      </g>
      <g>
        <circle cx="1012" cy="386" r="32" fill="#233d82" stroke="#adabff" stroke-width="1.5"/>
        <path d="M1001 386h8l6-10v20l-6-10h-8m21-8c7 5 7 11 0 16" fill="none" stroke="#d8d6ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="1012" y="439" fill="#f5f7ff" text-anchor="middle" font-size="20" font-weight="700">Reason</text>
        <text x="1012" y="463" fill="#b9b6f0" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="1">NEXT STEP</text>
      </g>
      <g>
        <circle cx="1012" cy="599" r="32" fill="#233d82" stroke="#83dfff" stroke-width="1.5"/>
        <path d="M1001 599h21m-8-8 8 8-8 8" fill="none" stroke="#b3f0ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="1012" y="652" fill="#f5f7ff" text-anchor="middle" font-size="20" font-weight="700">Act</text>
        <text x="1012" y="676" fill="#afc2f0" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="1">UI INPUT</text>
      </g>
      <g>
        <circle cx="186" cy="599" r="32" fill="#233d82" stroke="#9fe8cf" stroke-width="1.5"/>
        <path d="M174 599l8 8 17-18" fill="none" stroke="#a8f1d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="186" y="652" fill="#f5f7ff" text-anchor="middle" font-size="20" font-weight="700">Verify</text>
        <text x="186" y="676" fill="#a7ddce" text-anchor="middle" font-size="14" font-weight="600" letter-spacing="1">RESULT</text>
      </g>
    </g>

    <rect x="42" y="220" width="1116" height="530" rx="30" fill="none" stroke="#9db3ed" stroke-opacity=".4" stroke-width="1.3"/>
  </g>
  <text x="58" y="785" fill="#50618f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.3">OBSERVE  →  REASON  →  ACT  →  VERIFY  ↺</text>
  <text x="1142" y="785" fill="#50618f" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="end" letter-spacing="1.1">WEB + LEGACY SOFTWARE</text>
</svg>
