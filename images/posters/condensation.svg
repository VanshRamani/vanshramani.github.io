<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="poster-title poster-desc">
  <title id="poster-title">Graph Condensation Needs a Reset</title>
  <desc id="poster-desc">A scientific poster for the ICML 2026 Spotlight, illustrating a shift from full-dataset training and model dependence toward a compact condensed graph connected to several model branches.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#17202A" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#111820" fill-opacity=".2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#151A20"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2454E8"/>
    </marker>
    <style>
      text { font-family: Inter, "Avenir Next", "Helvetica Neue", Arial, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 750; letter-spacing: 2.4px; }
      .label { font-size: 13px; font-weight: 800; letter-spacing: 1.6px; }
      .small { font-size: 15px; font-weight: 600; }
      .node { stroke: #151A20; stroke-width: 2; }
      .wire { fill: none; stroke: #151A20; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Ground and quiet print-like framing -->
  <rect width="1200" height="800" fill="#F6F2A0"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <path d="M0 0h1200v800H0z" fill="none" stroke="#151A20" stroke-width="2"/>
  <path d="M34 34h1132v732H34z" fill="none" stroke="#151A20" stroke-opacity=".35" stroke-width="1"/>
  <circle cx="1086" cy="114" r="78" fill="#D9F35D"/>
  <circle cx="1086" cy="114" r="78" fill="url(#dots)" opacity=".42"/>
  <path d="M1017 104a70 70 0 0 1 118-38" fill="none" stroke="#2454E8" stroke-width="3"/>

  <!-- Masthead -->
  <text x="66" y="66" class="eyebrow">RETHINKING DATA-EFFICIENT LEARNING</text>
  <text x="63" y="155" font-size="83" font-weight="900" letter-spacing="-5">GRAPH</text>
  <text x="63" y="238" font-size="83" font-weight="900" letter-spacing="-5">CONDENSATION</text>
  <rect x="768" y="177" width="353" height="70" rx="3" fill="#151A20"/>
  <text x="788" y="225" font-size="39" font-weight="850" letter-spacing="-1.8" fill="#F6F2A0">NEEDS A RESET</text>
  <text x="67" y="279" font-size="20" font-weight="560" letter-spacing=".1">Move beyond full-dataset training and model dependence</text>
  <path d="M66 301H1134" stroke="#151A20" stroke-width="2"/>
  <circle cx="1134" cy="301" r="5" fill="#2454E8"/>

  <!-- Diagram section label -->
  <text x="66" y="340" class="eyebrow">FROM REPEATED TRAINING TO A SHARED GRAPH</text>

  <!-- Left: full graph and costly model loop -->
  <text x="86" y="382" class="label">FULL DATASET</text>
  <text x="86" y="401" font-size="12" font-weight="600" fill="#52595F">large graph · repeated input</text>
  <g aria-label="Dense full dataset graph">
    <path class="wire" d="M98 444 144 427 185 451 222 426 267 449 302 425M98 444 111 489 154 477 185 451 196 498 235 479 267 449 284 495 302 425M111 489 129 535 169 519 196 498 215 539 253 522 284 495M154 477 169 519M235 479 253 522M185 451 235 479M144 427 154 477M222 426 235 479M196 498 169 519"/>
    <g fill="#F6F2A0">
      <circle class="node" cx="98" cy="444" r="7"/><circle class="node" cx="144" cy="427" r="7"/><circle class="node" cx="185" cy="451" r="8"/><circle class="node" cx="222" cy="426" r="7"/><circle class="node" cx="267" cy="449" r="7"/><circle class="node" cx="302" cy="425" r="7"/>
      <circle class="node" cx="111" cy="489" r="7"/><circle class="node" cx="154" cy="477" r="8"/><circle class="node" cx="196" cy="498" r="7"/><circle class="node" cx="235" cy="479" r="8"/><circle class="node" cx="284" cy="495" r="7"/>
      <circle class="node" cx="129" cy="535" r="7"/><circle class="node" cx="169" cy="519" r="8"/><circle class="node" cx="215" cy="539" r="7"/><circle class="node" cx="253" cy="522" r="8"/>
    </g>
    <circle cx="185" cy="451" r="4" fill="#2454E8"/><circle cx="235" cy="479" r="4" fill="#C3E637"/><circle cx="169" cy="519" r="4" fill="#2454E8"/>
  </g>

  <!-- Model training block and loop: interrupted to mark the reset -->
  <path d="M324 472H387" fill="none" stroke="#151A20" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="329" y="452" class="label">TRAIN</text>
  <rect x="398" y="423" width="133" height="102" rx="5" fill="#2454E8" stroke="#151A20" stroke-width="2"/>
  <path d="M421 450h87M421 466h87M421 482h87M421 498h87" stroke="#DCE4FF" stroke-width="2" opacity=".85"/>
  <circle cx="431" cy="450" r="5" fill="#F6F2A0"/><circle cx="474" cy="466" r="5" fill="#D9F35D"/><circle cx="499" cy="482" r="5" fill="#F6F2A0"/>
  <text x="464" y="551" class="label" text-anchor="middle">MODEL</text>
  <text x="464" y="570" font-size="12" font-weight="600" text-anchor="middle" fill="#52595F">dataset-specific fit</text>
  <path d="M464 412V397Q464 373 440 373H148Q124 373 124 397V408" fill="none" stroke="#151A20" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
  <path d="m330 362 18 23m0-23-18 23" stroke="#D04432" stroke-width="5" stroke-linecap="round"/>

  <!-- Transformation hinge -->
  <path d="M552 472H616" fill="none" stroke="#151A20" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <circle cx="581" cy="472" r="24" fill="#D9F35D" stroke="#151A20" stroke-width="2"/>
  <path d="M572 472h18m-7-8 8 8-8 8" fill="none" stroke="#151A20" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="582" y="523" class="label" text-anchor="middle">CONDENSE</text>
  <text x="582" y="542" font-size="12" font-weight="600" text-anchor="middle" fill="#52595F">graph structure</text>

  <!-- Center: compact graph as reusable representation -->
  <rect x="625" y="393" width="202" height="170" rx="4" fill="#fffde0" stroke="#151A20" stroke-width="2"/>
  <path d="M648 418h156" stroke="#151A20" stroke-opacity=".28"/>
  <text x="726" y="413" class="label" text-anchor="middle">COMPACT GRAPH</text>
  <g transform="translate(0 8)">
    <path d="M678 465 714 443 753 461 783 438M678 465 691 507 729 516 753 461 777 502M714 443 729 516M753 461 777 502M691 507 714 443" fill="none" stroke="#2454E8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="678" cy="465" r="9" fill="#F6F2A0" stroke="#151A20" stroke-width="2"/>
    <circle cx="714" cy="443" r="10" fill="#2454E8" stroke="#151A20" stroke-width="2"/>
    <circle cx="753" cy="461" r="11" fill="#D9F35D" stroke="#151A20" stroke-width="2"/>
    <circle cx="783" cy="438" r="8" fill="#F6F2A0" stroke="#151A20" stroke-width="2"/>
    <circle cx="691" cy="507" r="8" fill="#D9F35D" stroke="#151A20" stroke-width="2"/>
    <circle cx="729" cy="516" r="10" fill="#F6F2A0" stroke="#151A20" stroke-width="2"/>
    <circle cx="777" cy="502" r="9" fill="#2454E8" stroke="#151A20" stroke-width="2"/>
    <circle cx="714" cy="443" r="3" fill="#F6F2A0"/><circle cx="777" cy="502" r="3" fill="#F6F2A0"/>
  </g>

  <!-- Right: three distinct model branches receive the compact graph -->
  <path d="M827 474H864M864 424V530" fill="none" stroke="#2454E8" stroke-width="3"/>
  <circle cx="864" cy="474" r="5" fill="#2454E8"/>
  <path d="M864 424H895M864 477H895M864 530H895" fill="none" stroke="#2454E8" stroke-width="3" marker-end="url(#blue-arrow)"/>
  <text x="924" y="382" class="label">MODEL BRANCHES</text>

  <!-- Branch A: layered/perceptron-like -->
  <rect x="903" y="396" width="213" height="53" rx="4" fill="#fffde0" stroke="#151A20" stroke-width="2"/>
  <g stroke="#151A20" stroke-width="1.5" fill="#D9F35D">
    <path d="M924 410 943 422 924 435M943 422 962 410M943 422 962 435" fill="none"/>
    <circle cx="924" cy="410" r="4"/><circle cx="924" cy="435" r="4"/><circle cx="943" cy="422" r="4"/><circle cx="962" cy="410" r="4"/><circle cx="962" cy="435" r="4"/>
  </g>
  <text x="986" y="428" font-size="14" font-weight="750">MODEL A</text>
  <circle cx="1094" cy="422" r="7" fill="#2454E8"/>

  <!-- Branch B: message-passing graph -->
  <rect x="903" y="450" width="213" height="53" rx="4" fill="#fffde0" stroke="#151A20" stroke-width="2"/>
  <g fill="#2454E8" stroke="#151A20" stroke-width="1.5">
    <path d="M923 477 941 463 960 479 941 490Z" fill="none"/>
    <circle cx="923" cy="477" r="4"/><circle cx="941" cy="463" r="4"/><circle cx="960" cy="479" r="4"/><circle cx="941" cy="490" r="4"/>
  </g>
  <text x="986" y="482" font-size="14" font-weight="750">MODEL B</text>
  <circle cx="1094" cy="476" r="7" fill="#D9F35D" stroke="#151A20" stroke-width="1.5"/>

  <!-- Branch C: attention-like multi-head structure -->
  <rect x="903" y="504" width="213" height="53" rx="4" fill="#fffde0" stroke="#151A20" stroke-width="2"/>
  <g stroke="#151A20" stroke-width="1.5">
    <path d="M923 530h39M923 520h39M923 540h39"/>
    <circle cx="927" cy="520" r="4" fill="#D9F35D"/><circle cx="939" cy="530" r="4" fill="#2454E8"/><circle cx="951" cy="540" r="4" fill="#D9F35D"/>
  </g>
  <text x="986" y="536" font-size="14" font-weight="750">MODEL C</text>
  <circle cx="1094" cy="530" r="7" fill="#2454E8"/>

  <!-- Quiet lower annotation and conference marker -->
  <path d="M66 610H1134" stroke="#151A20" stroke-width="1.5"/>
  <text x="67" y="646" class="eyebrow">GRAPH CONDENSATION</text>
  <text x="67" y="671" font-size="17" font-weight="550">A compact graph representation connected across model branches.</text>
  <g transform="translate(882 614)">
    <rect width="252" height="91" rx="3" fill="#2454E8"/>
    <path d="M17 18h35v2H17zM17 25h20v2H17z" fill="#D9F35D"/>
    <text x="17" y="52" font-size="12" font-weight="800" letter-spacing="2" fill="#D9F35D">ICML 2026</text>
    <text x="17" y="77" font-size="25" font-weight="850" letter-spacing="1.1" fill="#FFFFFF">SPOTLIGHT</text>
    <circle cx="225" cy="21" r="8" fill="#D9F35D"/>
  </g>
  <text x="66" y="741" font-size="11" font-weight="700" letter-spacing="1.4" fill="#52595F">DATA  →  STRUCTURE  →  MULTIPLE MODEL BRANCHES</text>
  <path d="M66 754H1134" stroke="#151A20" stroke-width="2"/>
  <circle cx="66" cy="754" r="4" fill="#2454E8"/><circle cx="1134" cy="754" r="4" fill="#2454E8"/>
</svg>
