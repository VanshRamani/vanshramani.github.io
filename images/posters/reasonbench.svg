<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="#211d49" role="img" aria-labelledby="title desc">
  <title id="title">REASONBENCH — benchmarking the instability of LLM reasoning</title>
  <desc id="desc">A single fixed question enters a branching field of reasoning traces. The traces fan through a conceptual reasoning landscape, then either converge on the same answer or end in different answers, illustrating the stability question studied by ReasonBENCH. This is a concept diagram, not quantitative result data.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f7f5fc"/><stop offset=".53" stop-color="#eeeafa"/><stop offset="1" stop-color="#e8e5f6"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2=".72">
      <stop stop-color="#f2effb"/><stop offset=".45" stop-color="#e9e8fb"/><stop offset="1" stop-color="#f5eff9"/>
    </linearGradient>
    <linearGradient id="stable" x1="0" y1="0" x2="1" y2=".2">
      <stop stop-color="#54459a"/><stop offset=".52" stop-color="#4867c4"/><stop offset="1" stop-color="#2e3f8e"/>
    </linearGradient>
    <linearGradient id="unstable" x1="0" y1="0" x2="1" y2=".3">
      <stop stop-color="#514690"/><stop offset=".58" stop-color="#7854b9"/><stop offset="1" stop-color="#bd4c9b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8ba4f1" stop-opacity=".27"/><stop offset="1" stop-color="#8ba4f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microgrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7773b5" stroke-opacity=".11" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#393364" flood-opacity=".12"/>
    </filter>
    <filter id="soft" x="-30%" y="-50%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <style>
      text{font-family:Arial,Helvetica,sans-serif}
      .eyebrow{font-size:14px;font-weight:700;letter-spacing:2.5px}
      .meta{font-size:14px;font-weight:700;letter-spacing:1.6px}
      .minor{font-size:15px;font-weight:500;letter-spacing:.3px}
      .path-under{fill:none;stroke:#fbfaff;stroke-opacity:.84;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}
      .path-core{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
      .thread{fill:none;stroke:#6059a4;stroke-opacity:.38;stroke-width:1.5;stroke-linecap:round}
      .node{fill:#faf9ff;stroke:#554d9e;stroke-width:2.2}
    </style>
  </defs>

  <rect width="1200" height="800" fill="url(#paper)"/>
  <rect x="26" y="24" width="1148" height="752" rx="26" fill="#fcfbff" stroke="#d9d5ee" stroke-width="1.3"/>
  <path d="M55 198H1145" stroke="#d9d5ee" stroke-width="1.2"/>
  <circle cx="1080" cy="145" r="178" fill="#dedcf7" opacity=".43"/>
  <circle cx="1080" cy="145" r="124" fill="none" stroke="#8884bf" stroke-opacity=".15"/>
  <circle cx="1080" cy="145" r="92" fill="none" stroke="#8884bf" stroke-opacity=".12"/>

  <text x="68" y="60" class="eyebrow" fill="#665da2">RESEARCH PAPER <tspan fill="#c1459d">/</tspan> ICML 2026</text>
  <text x="66" y="145" font-size="91" font-weight="900" letter-spacing="-5.2">REASONBENCH</text>
  <text x="70" y="179" font-size="21" font-weight="500" fill="#585475">Benchmarking the (In)Stability of LLM Reasoning</text>
  <g transform="translate(932 42)">
    <rect width="184" height="37" rx="18.5" fill="#eeeafb" stroke="#d8d2f0"/>
    <circle cx="19" cy="18.5" r="5" fill="#b34b9e"/>
    <text x="34" y="23" class="meta" fill="#554d91">EIML WORKSHOP</text>
    <text x="0" y="65" font-size="13" font-weight="700" letter-spacing="1.55" fill="#827da7">ICML · 2026</text>
  </g>

  <!-- The reasoning landscape: a restrained field of construction lines and soft light. -->
  <rect x="57" y="219" width="1086" height="437" rx="24" fill="url(#field)" stroke="#dddaf0" stroke-width="1.2"/>
  <rect x="57" y="219" width="1086" height="437" rx="24" fill="url(#microgrid)" opacity=".55"/>
  <ellipse cx="641" cy="430" rx="358" ry="223" fill="url(#glow)"/>
  <ellipse cx="641" cy="430" rx="254" ry="146" fill="none" stroke="#8f8ac6" stroke-opacity=".16" stroke-width="1.2"/>
  <ellipse cx="641" cy="430" rx="202" ry="111" fill="none" stroke="#8f8ac6" stroke-opacity=".13" stroke-width="1.2"/>

  <text x="83" y="257" class="eyebrow" fill="#554d91">ONE QUESTION</text>
  <text x="331" y="257" class="eyebrow" fill="#554d91">REASONING PATHS</text>
  <text x="963" y="257" class="eyebrow" fill="#554d91">OUTCOMES</text>

  <!-- One fixed prompt, deliberately the only source in the diagram. -->
  <g filter="url(#shadow)">
    <rect x="80" y="282" width="202" height="277" rx="22" fill="#fff" stroke="#d7d2ee" stroke-width="1.3"/>
  </g>
  <rect x="99" y="301" width="164" height="24" rx="12" fill="#f0edfa"/>
  <circle cx="114" cy="313" r="4" fill="#655ca7"/>
  <text x="126" y="318" font-size="12" font-weight="700" letter-spacing="1.6" fill="#625a9c">FIXED PROMPT</text>
  <circle cx="181" cy="414" r="58" fill="#f1effa" stroke="#dcd8f0" stroke-width="1.5"/>
  <circle cx="181" cy="414" r="43" fill="none" stroke="#aaa4d1" stroke-width="1.2" stroke-dasharray="2 6"/>
  <text x="181" y="442" text-anchor="middle" font-size="82" font-weight="800" letter-spacing="-5" fill="#453d82">Q</text>
  <path d="M114 496H248" stroke="#e7e4f2"/>
  <text x="181" y="523" text-anchor="middle" class="minor" fill="#6c688c">same input</text>

  <!-- A quiet inlet gathers into a vivid branching weave. -->
  <path d="M282 420H322" stroke="#4e478f" stroke-width="4" stroke-linecap="round"/>
  <circle cx="322" cy="420" r="7" fill="#fff" stroke="#51498f" stroke-width="3"/>
  <path d="M322 420C365 420 360 322 417 322" fill="none" stroke="#544d98" stroke-width="2.2"/>
  <path d="M322 420C370 420 374 379 424 379" fill="none" stroke="#544d98" stroke-width="2.2"/>
  <path d="M322 420C380 420 375 440 425 440" fill="none" stroke="#544d98" stroke-width="2.2"/>
  <path d="M322 420C369 420 371 502 421 502" fill="none" stroke="#544d98" stroke-width="2.2"/>
  <path d="M322 420C359 420 370 552 418 552" fill="none" stroke="#544d98" stroke-width="2.2"/>

  <!-- Five luminous traces travel through a branching, crossing reasoning space. -->
  <g class="path-under">
    <path d="M417 322C480 322 478 359 539 357S633 301 701 328 820 358 915 364"/>
    <path d="M424 379C486 379 486 342 548 341S647 374 708 353 832 359 915 364"/>
    <path d="M425 440C493 440 492 399 553 399S654 384 718 368 834 363 915 364"/>
    <path d="M421 502C485 502 485 466 549 467S654 423 716 394 839 366 915 364"/>
    <path d="M418 552C490 552 495 512 556 516S660 463 726 420 837 374 915 364"/>
    <path d="M417 322C480 322 489 399 543 402S635 454 696 459 814 457 915 532"/>
    <path d="M424 379C493 379 500 430 556 430S642 478 700 486 823 516 915 532"/>
    <path d="M425 440C488 440 501 465 558 465S649 503 712 521 829 549 915 532"/>
    <path d="M421 502C486 502 504 505 558 505S652 529 713 548 828 558 915 586"/>
    <path d="M418 552C480 552 500 551 557 551S655 563 716 574 830 588 915 586"/>
  </g>
  <g class="path-core">
    <path d="M417 322C480 322 478 359 539 357S633 301 701 328 820 358 915 364" stroke="#4652ac"/>
    <path d="M424 379C486 379 486 342 548 341S647 374 708 353 832 359 915 364" stroke="#536cce"/>
    <path d="M425 440C493 440 492 399 553 399S654 384 718 368 834 363 915 364" stroke="#6452ab"/>
    <path d="M421 502C485 502 485 466 549 467S654 423 716 394 839 366 915 364" stroke="#7858b8"/>
    <path d="M418 552C490 552 495 512 556 516S660 463 726 420 837 374 915 364" stroke="#7956ac"/>
    <path d="M417 322C480 322 489 399 543 402S635 454 696 459 814 457 915 532" stroke="#5555a9"/>
    <path d="M424 379C493 379 500 430 556 430S642 478 700 486 823 516 915 532" stroke="#6860b6"/>
    <path d="M425 440C488 440 501 465 558 465S649 503 712 521 829 549 915 532" stroke="#7559b3"/>
    <path d="M421 502C486 502 504 505 558 505S652 529 713 548 828 558 915 586" stroke="#9950b5"/>
    <path d="M418 552C480 552 500 551 557 551S655 563 716 574 830 588 915 586" stroke="#bd4c9b"/>
  </g>

  <!-- Local inference marks: branching junctions, checkpoints, and short signal ticks. -->
  <g fill="#fff" stroke="#6557a8" stroke-width="2.2">
    <circle cx="539" cy="357" r="6"/><circle cx="548" cy="341" r="5"/><circle cx="553" cy="399" r="5"/>
    <circle cx="556" cy="467" r="6"/><circle cx="556" cy="516" r="5"/><circle cx="543" cy="402" r="5"/>
    <circle cx="696" cy="459" r="6"/><circle cx="708" cy="353" r="5"/><circle cx="712" cy="521" r="5"/>
    <circle cx="726" cy="420" r="5"/><circle cx="716" cy="574" r="5"/>
  </g>
  <g fill="#b54f9f">
    <circle cx="606" cy="332" r="3.5"/><circle cx="623" cy="412" r="3.5"/><circle cx="638" cy="494" r="3.5"/>
    <circle cx="774" cy="353" r="3.5"/><circle cx="789" cy="476" r="3.5"/><circle cx="795" cy="557" r="3.5"/>
  </g>
  <g stroke="#6963a7" stroke-opacity=".38" stroke-width="1.2">
    <path d="M578 293v14M590 293v8M602 293v17M764 608v-12M776 608v-18M788 608v-10"/>
    <path d="M454 590h10M454 601h16M454 612h8M858 300h9M858 311h16M858 322h9"/>
  </g>

  <!-- Stable and changing outcomes are intentionally qualitative, not measured values. -->
  <path d="M915 364C936 364 936 358 953 358" fill="none" stroke="#435db8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="915" cy="364" r="8" fill="#fbfaff" stroke="#435db8" stroke-width="3"/>
  <path d="M915 532C935 532 936 544 953 544M915 586C936 586 936 574 953 574" fill="none" stroke="#8d52b4" stroke-width="4" stroke-linecap="round"/>
  <circle cx="915" cy="532" r="8" fill="#fbfaff" stroke="#8b55b5" stroke-width="3"/>
  <circle cx="915" cy="586" r="8" fill="#fbfaff" stroke="#b14b9f" stroke-width="3"/>

  <g filter="url(#shadow)">
    <rect x="953" y="290" width="166" height="149" rx="20" fill="#fff" stroke="#c9d5f0" stroke-width="1.5"/>
    <rect x="953" y="471" width="166" height="153" rx="20" fill="#fff" stroke="#ded0eb" stroke-width="1.5"/>
  </g>
  <rect x="974" y="307" width="124" height="25" rx="12.5" fill="#edf0fc"/>
  <text x="1036" y="324" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.4" fill="#4358ab">STABLE</text>
  <circle cx="1036" cy="384" r="35" fill="#eef1fc" stroke="#cbd4f1" stroke-width="1.5"/>
  <text x="1036" y="396" text-anchor="middle" font-size="40" font-weight="800" fill="#4358ab">A</text>
  <rect x="974" y="487" width="124" height="25" rx="12.5" fill="#f4eafa"/>
  <text x="1036" y="504" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#974aa2">UNSTABLE</text>
  <circle cx="1001" cy="559" r="27" fill="#f1effa" stroke="#d8d1ef" stroke-width="1.3"/>
  <text x="1001" y="570" text-anchor="middle" font-size="32" font-weight="800" fill="#554b95">A</text>
  <path d="M1038 559h14" stroke="#aa67aa" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="1077" cy="559" r="27" fill="#f9edf7" stroke="#edc8e3" stroke-width="1.3"/>
  <text x="1077" y="570" text-anchor="middle" font-size="32" font-weight="800" fill="#b54e9e">B</text>
  <text x="1036" y="607" text-anchor="middle" font-size="12" font-weight="600" letter-spacing="1" fill="#81799e">ANSWERS DIVERGE</text>

  <!-- Editorial footer: the citation is clear at poster size without competing with the art. -->
  <path d="M57 681H1143" stroke="#d9d5ee" stroke-width="1.2"/>
  <text x="68" y="718" font-size="18" font-weight="700" fill="#393465">ReasonBENCH</text>
  <text x="68" y="745" font-size="14" font-weight="500" fill="#777293">Benchmarking the (In)Stability of LLM Reasoning</text>
  <g transform="translate(835 712)">
    <circle cx="4" cy="0" r="4" fill="#5264c1"/><text x="18" y="5" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5f5a83">REASONING TRACES</text>
    <circle cx="186" cy="0" r="4" fill="#b54f9f"/><text x="200" y="5" font-size="12" font-weight="700" letter-spacing="1.2" fill="#5f5a83">ANSWER VARIATION</text>
  </g>
  <text x="1130" y="750" text-anchor="end" font-size="12" font-weight="700" letter-spacing="1.35" fill="#8a85a8">EIML WORKSHOP · ICML 2026</text>
</svg>
